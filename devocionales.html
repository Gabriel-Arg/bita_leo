<!DOCTYPE html>

<html lang="es">

<head>
    <!-- ------------META DATOS--------------------------------------------------------------- -->
    <meta name="author" content="Gabriel Díaz">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Bitácora para Leo">
    <meta name="robots" content="index,follow">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- ------------PESTAÑA DEL NAVEGADOR---------------------------------------------------- -->
    <title> Devocionales | Bitácora </title>
    <link rel="icon" href="icon/brujula.png">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo&display=swap" rel="stylesheet">

    <!-- ----------ENLACE A MI HOJA DE ESTILO EXTERNO CSS------------------------------------- -->
    <link rel="stylesheet" href="css/mobile-lista.css">
</head>


<body>

    <!---------------------- CAJA MADRE: engloba todo-------------------------------------- -->
    <div class="caja_madre">

        <!-- BOX HIJO 1: buscador y menú ------------------------------------------------------>
        <div class="box_hijo_1">

            <!-- BUSCADOR -------------------------------------------------->
            <div class="box_hijo_1A" role="search">
                <input type="search" id="buscador" placeholder="Buscar..." aria-label="Buscar publicaciones"
                    autocomplete="off">
                <button type="button" id="btn_buscar" aria-label="Buscar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="10" cy="10" r="6"></circle>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                    </svg>
                </button>
            </div>

            <!-- MENÚ ------------------------------->
            <div class="box_hijo_1B">Menú</div>
        </div>

        <!-- BOX HIJO 2: tarjetas ------------------------------------------------------------->
        <div class="box_hijo_2">

        </div>

        <!-- BOX HIJO 3: paginación ----------------------------------------------------------->
        <div class="box_hijo_3">
            <div class="box_hijo_3A">
                <button type="button" id="btn_atras">Atrás</button>
            </div>
            <div class="box_hijo_3B" id="numeros"></div>
            <div class="box_hijo_3C">
                <button type="button" id="btn_siguiente">Siguiente</button>
            </div>
        </div>

    </div>

    <script src="js/datos-devocionales.js"></script>
    <script src="js/lista.js"></script>

</body>

</html>
